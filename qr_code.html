<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code | SWEStudio.dev</title>
  <link rel="stylesheet" href="styles/qr_code.css">
</head>
<body>

  <main class="qr-page">
    <section class="panel glass3d">
      <div class="panel-inner">
        <h1>Scan to visit</h1>
        <p class="lede">Point your phone's camera at the code to open my website.</p>

        <!-- Replace images/qr-code.png with the path to your QR code image -->
        <div class="qr-card">
          <img src="assets/swestudio.png" alt="QR code linking to my website">
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="index.html" class="hex-wrapper glass3d" aria-label="Back to home">
      <div class="hex-content"><span>Home</span></div>
    </a>
  </footer>

</body>
</html>
